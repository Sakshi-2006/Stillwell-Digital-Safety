kind = "web"
previewPath = "/"
title = "Privacy Risk Assessment"
description = "A defensive educational app that lets people assess self-reported social-media privacy settings, understand exposure categories, explore improvements, and create a private report without collecting personal details."
version = "1.0.0"
id = "artifacts/privacy-risk-assessment"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21098

[services.development]
run = "pnpm --filter @workspace/privacy-risk-assessment run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/privacy-risk-assessment", "run", "build" ]
serve = "static"
publicDir = "artifacts/privacy-risk-assessment/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21098"
BASE_PATH = "/"
